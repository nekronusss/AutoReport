name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_DB: dqflow
          POSTGRES_PASSWORD: ci-bootstrap-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d dqflow'
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca
        with:
          version: 0.9.8
          python-version: '3.12.12'
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run mypy src/dqflow
      - name: Bootstrap isolated test database
        run: |
          sed -i 's/port: 55432/port: 5432/' config/local.yaml
          uv run dqflow local-init
          printf '%s' 'ci-bootstrap-only' > secrets/db_admin_password
          uv run dqflow bootstrap-roles
          uv run dqflow migrate
          uv run dqflow doctor
      - name: Unit, PostgreSQL integration and dbt
        env:
          DQFLOW_INTEGRATION: '1'
        run: uv run pytest -q tests --junitxml=data/acceptance.xml
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/dqflow-requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/dqflow-requirements.txt
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: false
          tags: dqflow:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-evidence
          path: data/acceptance.xml

