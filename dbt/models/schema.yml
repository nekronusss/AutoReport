version: 2
sources:
  - name: typed
    schema: "{{ env_var('DQ_SCHEMA') }}"
    tables:
      - name: customers
models:
  - name: fact_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('typed', 'customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, completed, cancelled]
  - name: daily_summary
    columns:
      - name: business_date
        data_tests: [unique, not_null]
