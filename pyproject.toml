[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dqflow"
version = "0.1.0"
description = "Auditable order snapshots, quality gates and atomic reporting"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]==3.2.10", "pydantic==2.12.3", "httpx==0.28.1",
  "typer==0.20.0", "Jinja2==3.1.6", "PyYAML==6.0.3", "alembic==1.17.1",
  "dbt-core==1.12.5", "dbt-postgres==1.11.0", "sqlparse==0.6.0", "tzdata==2025.2",
  "fastapi==0.143.0", "starlette==1.7.0", "uvicorn==0.38.0", "psutil==7.1.3"
]
[project.scripts]
dqflow = "dqflow.cli:app"
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.14.4", "mypy==1.18.2", "types-PyYAML==6.0.12.20250915"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires migrated PostgreSQL"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
